<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Isaac Solverro — Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0c;
      --bg-card: #111114;
      --surface: #16161a;
      --surface2: #1c1c21;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.11);
      --text: #f0eff4;
      --text-muted: #7a7a86;
      --accent: #8b1e2d;
      --accent-glow: rgba(139,30,45,0.35);
      --accent-light: #b02436;
      --radius: 10px;
      --panel: 260px;
      --toolbar-h: 56px;
      --tr: all 0.22s cubic-bezier(.16,1,.3,1);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── GRAIN ── */
    .grain {
      position:fixed; inset:0; pointer-events:none; z-index:999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity:0.6; mix-blend-mode:overlay;
    }

    /* ── TOP BAR ── */
    #topbar {
      height: var(--toolbar-h);
      background: rgba(10,10,12,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
      position: relative;
    }

    .logo-link {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; flex-shrink: 0;
    }
    .logo-back {
      width:32px; height:32px; border-radius:8px;
      background: var(--surface); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      color: var(--text-muted); transition: var(--tr);
    }
    .logo-back:hover { background: var(--accent); color:white; }
    .logo-back svg { width:14px; height:14px; }
    .logo-text {
      font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:700;
      color:var(--text); letter-spacing:-0.02em;
    }
    .logo-text span { color:var(--accent); }

    .sep { width:1px; height:28px; background:var(--border); flex-shrink:0; }

    .page-title {
      font-size:0.85rem; font-weight:500; color:var(--text-muted);
      display:flex; align-items:center; gap:6px;
    }
    .page-title svg { width:14px; height:14px; color:var(--accent); }

    .topbar-spacer { flex:1; }

    /* canvas size picker */
    .size-select {
      display:flex; align-items:center; gap:8px;
      background: var(--surface); border:1px solid var(--border);
      border-radius:8px; padding:6px 12px;
      font-size:0.82rem; color:var(--text-muted);
    }
    .size-select svg { width:13px; height:13px; }
    .size-select select {
      background:transparent; border:none; outline:none;
      color:var(--text); font-family:inherit; font-size:0.82rem; cursor:pointer;
    }
    .size-select select option { background:#1c1c21; }

    .btn {
      display:inline-flex; align-items:center; gap:7px;
      padding:8px 14px; border:1px solid var(--border);
      border-radius:8px; font-family:'Inter',sans-serif;
      font-weight:500; font-size:0.82rem; cursor:pointer;
      transition:var(--tr); background:var(--surface); color:var(--text-muted);
      white-space:nowrap;
    }
    .btn:hover { color:var(--text); border-color:var(--border2); transform:translateY(-1px); }
    .btn svg { width:14px; height:14px; flex-shrink:0; }
    .btn-accent {
      background:var(--accent); border-color:var(--accent); color:white;
    }
    .btn-accent:hover { background:var(--accent-light); border-color:var(--accent-light); color:white; box-shadow:0 6px 20px var(--accent-glow); }

    /* ── WORKSPACE ── */
    #workspace {
      flex:1; display:flex; overflow:hidden; position:relative;
    }

    /* ── LEFT TOOLS ── */
    #tools-panel {
      width:52px; background:var(--bg-card);
      border-right:1px solid var(--border);
      display:flex; flex-direction:column;
      align-items:center; padding:10px 0; gap:4px;
      flex-shrink:0; overflow-y:auto;
    }

    .tool-btn {
      width:38px; height:38px; border-radius:8px;
      border:1px solid transparent;
      background:transparent; color:var(--text-muted);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:var(--tr); position:relative;
    }
    .tool-btn svg { width:17px; height:17px; }
    .tool-btn:hover { background:var(--surface); color:var(--text); }
    .tool-btn.active { background:var(--accent); color:white; border-color:var(--accent); }

    .tool-sep { width:28px; height:1px; background:var(--border); margin:4px 0; }

    /* tooltip */
    .tool-btn::after {
      content: attr(data-tip);
      position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%);
      background:var(--surface2); color:var(--text); font-size:0.75rem;
      padding:5px 9px; border-radius:6px; border:1px solid var(--border2);
      white-space:nowrap; pointer-events:none; opacity:0;
      transition:opacity 0.15s ease; z-index:200;
    }
    .tool-btn:hover::after { opacity:1; }

    /* ── CENTER CANVAS AREA ── */
    #canvas-area {
      flex:1; display:flex; align-items:center; justify-content:center;
      overflow:auto; background:var(--bg);
      background-image: radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size:28px 28px;
      padding:40px;
      position:relative;
    }

    #canvas-wrapper {
      position:relative;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.6);
      border-radius:2px;
      flex-shrink:0;
    }

    #main-canvas { display:block; }

    /* zoom indicator */
    #zoom-indicator {
      position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:20px; padding:5px 14px;
      font-size:0.78rem; color:var(--text-muted);
      display:flex; align-items:center; gap:10px;
    }
    .zoom-btn {
      background:transparent; border:none; color:var(--text-muted);
      cursor:pointer; font-size:1rem; line-height:1; transition:var(--tr);
      padding:0 2px;
    }
    .zoom-btn:hover { color:var(--text); }

    /* ── RIGHT PROPERTIES PANEL ── */
    #props-panel {
      width: var(--panel); background:var(--bg-card);
      border-left:1px solid var(--border);
      display:flex; flex-direction:column;
      flex-shrink:0; overflow-y:auto;
    }

    .panel-section {
      border-bottom:1px solid var(--border);
      padding:14px;
    }

    .panel-label {
      font-size:0.7rem; font-weight:600; letter-spacing:0.08em;
      text-transform:uppercase; color:var(--text-muted);
      margin-bottom:10px;
    }

    .prop-row {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:8px; gap:8px;
    }
    .prop-row:last-child { margin-bottom:0; }

    .prop-label {
      font-size:0.78rem; color:var(--text-muted); flex-shrink:0; min-width:52px;
    }

    .prop-input {
      background:var(--surface); border:1px solid var(--border);
      border-radius:6px; padding:5px 8px; font-size:0.8rem;
      color:var(--text); font-family:inherit; outline:none;
      transition:var(--tr); width:100%;
    }
    .prop-input:focus { border-color:var(--accent); }
    .prop-input[type="color"] {
      padding:2px 4px; height:30px; cursor:pointer; width:38px; flex-shrink:0;
    }
    .prop-input[type="range"] {
      padding:0; height:4px; accent-color:var(--accent); cursor:pointer;
    }

    .prop-select {
      background:var(--surface); border:1px solid var(--border);
      border-radius:6px; padding:5px 8px; font-size:0.8rem;
      color:var(--text); font-family:inherit; outline:none; width:100%; cursor:pointer;
    }
    .prop-select option { background:#1c1c21; }

    .icon-row { display:flex; gap:5px; }
    .icon-toggle {
      width:30px; height:28px; border-radius:6px;
      border:1px solid var(--border);
      background:var(--surface); color:var(--text-muted);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:var(--tr); flex-shrink:0;
    }
    .icon-toggle svg { width:13px; height:13px; }
    .icon-toggle:hover { color:var(--text); }
    .icon-toggle.active { background:var(--accent); border-color:var(--accent); color:white; }

    /* template grid */
    .template-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:8px;
    }
    .tpl-card {
      aspect-ratio:3/4; border-radius:8px; border:1px solid var(--border);
      background:var(--surface); cursor:pointer; overflow:hidden;
      position:relative; transition:var(--tr);
      display:flex; align-items:center; justify-content:center;
    }
    .tpl-card:hover { border-color:var(--accent); transform:scale(1.03); }
    .tpl-card canvas { width:100%; height:100%; object-fit:cover; }
    .tpl-label {
      position:absolute; bottom:5px; left:0; right:0; text-align:center;
      font-size:0.65rem; color:var(--text-muted);
    }

    /* layer list */
    .layer-item {
      display:flex; align-items:center; gap:8px;
      padding:6px 8px; border-radius:6px; cursor:pointer;
      transition:var(--tr); font-size:0.8rem; color:var(--text-muted);
      border:1px solid transparent; margin-bottom:3px;
    }
    .layer-item:hover { background:var(--surface); color:var(--text); }
    .layer-item.active { background:rgba(139,30,45,0.15); border-color:rgba(139,30,45,0.3); color:var(--text); }
    .layer-item svg { width:13px; height:13px; flex-shrink:0; }
    .layer-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .layer-vis {
      opacity:0; width:18px; height:18px; display:flex; align-items:center; justify-content:center;
      border-radius:4px; cursor:pointer; flex-shrink:0;
    }
    .layer-item:hover .layer-vis { opacity:1; }
    .layer-vis:hover { background:var(--surface2); }
    .layer-vis svg { width:12px; height:12px; }

    .layer-actions {
      display:flex; gap:4px; margin-top:8px;
    }
    .layer-action-btn {
      flex:1; padding:5px; border-radius:6px; border:1px solid var(--border);
      background:var(--surface); color:var(--text-muted); cursor:pointer;
      font-size:0.7rem; display:flex; align-items:center; justify-content:center; gap:4px;
      transition:var(--tr);
    }
    .layer-action-btn svg { width:11px; height:11px; }
    .layer-action-btn:hover { color:var(--text); border-color:var(--border2); }
    .layer-action-btn.del:hover { background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.3); color:#ef4444; }

    /* ── TOAST ── */
    #toast-container {
      position:fixed; bottom:2rem; left:50%; transform:translateX(-50%);
      z-index:9999; display:flex; flex-direction:column; gap:6px; pointer-events:none;
    }
    .toast {
      background:var(--surface2); border:1px solid var(--border2);
      color:var(--text); padding:9px 16px; border-radius:8px;
      font-size:0.82rem; font-weight:500;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
      display:flex; align-items:center; gap:7px;
      animation:toastIn 0.3s cubic-bezier(.16,1,.3,1) both;
    }
    .toast svg { width:13px; height:13px; }
    .toast.ok svg { color:#22c55e; }
    @keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(6px)} }

    /* scrollbar */
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

    /* hide props when nothing selected */
    #no-selection {
      padding:20px 14px; text-align:center;
      font-size:0.8rem; color:var(--text-muted);
      line-height:1.6;
    }
    #no-selection svg { width:32px; height:32px; color:var(--text-muted); opacity:0.3; margin-bottom:8px; }

    #selection-props { display:none; }
  </style>
</head>
<body>

<div class="grain"></div>

<!-- ── TOP BAR ── -->
<div id="topbar">
  <a href="index.html" class="logo-link">
    <div class="logo-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <span class="logo-text">Isaac <span>Solverro</span></span>
  </a>

  <div class="sep"></div>
  <div class="page-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    Studio
  </div>

  <div class="topbar-spacer"></div>

  <div class="size-select">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
    <select id="canvas-size">
      <option value="794,1123">A4 Portrait</option>
      <option value="1123,794">A4 Paysage</option>
      <option value="800,800">Carré 800×800</option>
      <option value="1080,1080">Instagram Post</option>
      <option value="1080,1920">Story / Reel</option>
      <option value="1280,720">Présentation 16:9</option>
      <option value="600,400">Bannière web</option>
    </select>
  </div>

  <div class="sep"></div>

  <button class="btn" id="undoBtn" title="Annuler">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.44"/></svg>
    Annuler
  </button>

  <button class="btn" id="exportPng">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    PNG
  </button>

  <button class="btn btn-accent" id="exportPdf">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Exporter PDF
  </button>
</div>

<!-- ── WORKSPACE ── -->
<div id="workspace">

  <!-- LEFT TOOLS -->
  <div id="tools-panel">
    <button class="tool-btn active" data-tool="select" data-tip="Sélection (V)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-3 7z"/></svg>
    </button>

    <div class="tool-sep"></div>

    <button class="tool-btn" data-tool="rect" data-tip="Rectangle (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
    </button>
    <button class="tool-btn" data-tool="circle" data-tip="Cercle (C)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
    </button>
    <button class="tool-btn" data-tool="triangle" data-tip="Triangle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 22 2 22"/></svg>
    </button>
    <button class="tool-btn" data-tool="line" data-tip="Ligne (L)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="21" x2="21" y2="3"/></svg>
    </button>

    <div class="tool-sep"></div>

    <button class="tool-btn" data-tool="text" data-tip="Texte (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    </button>

    <div class="tool-sep"></div>

    <button class="tool-btn" data-tool="image" data-tip="Image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>

    <div class="tool-sep"></div>

    <button class="tool-btn" data-tool="draw" data-tip="Dessin libre (D)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
    </button>

    <div class="tool-sep"></div>

    <button class="tool-btn" id="clearCanvas" data-tip="Vider le canvas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </button>

    <!-- bg color -->
    <div class="tool-sep"></div>
    <div style="position:relative; width:38px; height:38px; display:flex; align-items:center; justify-content:center;" title="Couleur de fond">
      <div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);overflow:hidden;cursor:pointer;position:relative;">
        <input type="color" id="bgColorInput" value="#ffffff" style="position:absolute;inset:-4px;opacity:0;cursor:pointer;width:32px;height:32px;">
        <div id="bgColorPreview" style="width:100%;height:100%;background:#ffffff;"></div>
      </div>
    </div>
  </div>

  <!-- CANVAS AREA -->
  <div id="canvas-area">
    <div id="canvas-wrapper">
      <canvas id="main-canvas"></canvas>
    </div>
    <div id="zoom-indicator">
      <button class="zoom-btn" id="zoomOut">−</button>
      <span id="zoom-val">100%</span>
      <button class="zoom-btn" id="zoomIn">+</button>
      <button class="zoom-btn" id="zoomFit" style="font-size:0.7rem;margin-left:4px;">Ajuster</button>
    </div>
  </div>

  <!-- RIGHT PROPERTIES PANEL -->
  <div id="props-panel">

    <!-- TEMPLATES -->
    <div class="panel-section">
      <div class="panel-label">Modèles rapides</div>
      <div class="template-grid" id="template-grid">
        <div class="tpl-card" data-tpl="trading" title="Setup Trading">
          <canvas width="90" height="120" id="tpl-trading"></canvas>
          <div class="tpl-label">Setup Trade</div>
        </div>
        <div class="tpl-card" data-tpl="journal" title="Journal">
          <canvas width="90" height="120" id="tpl-journal"></canvas>
          <div class="tpl-label">Journal</div>
        </div>
        <div class="tpl-card" data-tpl="affiche" title="Affiche">
          <canvas width="90" height="120" id="tpl-affiche"></canvas>
          <div class="tpl-label">Affiche</div>
        </div>
        <div class="tpl-card" data-tpl="blank" title="Vierge">
          <canvas width="90" height="120" id="tpl-blank"></canvas>
          <div class="tpl-label">Vierge</div>
        </div>
      </div>
    </div>

    <!-- OBJECT PROPERTIES -->
    <div class="panel-section">
      <div class="panel-label">Propriétés</div>
      <div id="no-selection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        <div>Sélectionne un élément pour modifier ses propriétés</div>
      </div>
      <div id="selection-props">
        <!-- Position / Size -->
        <div class="prop-row">
          <span class="prop-label">X / Y</span>
          <input type="number" class="prop-input" id="propX" style="width:60px"> 
          <input type="number" class="prop-input" id="propY" style="width:60px">
        </div>
        <div class="prop-row">
          <span class="prop-label">L / H</span>
          <input type="number" class="prop-input" id="propW" style="width:60px">
          <input type="number" class="prop-input" id="propH" style="width:60px">
        </div>
        <div class="prop-row">
          <span class="prop-label">Angle</span>
          <input type="number" class="prop-input" id="propAngle" min="-360" max="360">
        </div>
        <div class="prop-row">
          <span class="prop-label">Opacité</span>
          <input type="range" class="prop-input" id="propOpacity" min="0" max="1" step="0.01">
        </div>

        <!-- Fill / Stroke -->
        <div style="height:8px"></div>
        <div class="prop-row">
          <span class="prop-label">Fond</span>
          <input type="color" class="prop-input" id="propFill">
          <button class="icon-toggle" id="propNoFill" title="Sans fond" style="flex-shrink:0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </button>
        </div>
        <div class="prop-row">

            <input type="checkbox" id="propShadow" style="accent-color:var(--accent)"> Activer
          </label>

        <!-- Arrange -->
        <div style="height:8px"></div>
        <div class="icon-row">
          <button class="icon-toggle" id="bringForward" title="Premier plan" style="flex:1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="icon-toggle" id="sendBackward" title="Arrière plan" style="flex:1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="13" height="13" rx="2"/><path d="M15 9h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-1"/></svg>
          </button>
          <button class="icon-toggle" id="dupObj" title="Dupliquer" style="flex:1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="icon-toggle del" id="delObj" title="Supprimer" style="flex:1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- LAYERS -->
    <div class="panel-section" style="flex:1">
      <div class="panel-label">Calques</div>
      <div id="layers-list"></div>
    </div>

  </div>
</div>

<!-- IMAGE input hidden -->
<input type="file" id="imageFileInput" accept="image/*" style="display:none">

<!-- TOAST -->
<div id="toast-container"></div>

<script>
// ──────────────────────────────────────────────────
//  FABRIC.JS CANVAS SETUP
// ──────────────────────────────────────────────────

const SIZES = {
  "794,1123":  [794, 1123],
  "1123,794":  [1123, 794],
  "800,800":   [800, 800],
  "1080,1080": [1080, 1080],
  "1080,1920": [1080, 1920],
  "1280,720":  [1280, 720],
  "600,400":   [600, 400],
};

let cw = 794, ch = 1123;
let zoom = 1;
let currentTool = 'select';
let history = [];
let isDrawing = false;
let drawStart = null;
let tempShape = null;
let suppressPropUpdate = false;

const wrapper   = document.getElementById('canvas-wrapper');
const canvasEl  = document.getElementById('main-canvas');

const canvas = new fabric.Canvas('main-canvas', {
  backgroundColor: '#ffffff',
  preserveObjectStacking: true,
  selection: true,
});

function setCanvasSize(w, h) {
  cw = w; ch = h;
  canvas.setWidth(w);
  canvas.setHeight(h);
  wrapper.style.width  = w + 'px';
  wrapper.style.height = h + 'px';
  fitZoom();
  canvas.renderAll();
}

function fitZoom() {
  const area = document.getElementById('canvas-area');
  const aw = area.clientWidth  - 80;
  const ah = area.clientHeight - 80;
  zoom = Math.min(aw / cw, ah / ch, 1);
  zoom = Math.max(zoom, 0.1);
  applyZoom();
}

function applyZoom() {
  canvas.setZoom(zoom);
  canvas.setWidth(Math.round(cw * zoom));
  canvas.setHeight(Math.round(ch * zoom));
  wrapper.style.width  = canvas.getWidth()  + 'px';
  wrapper.style.height = canvas.getHeight() + 'px';
  document.getElementById('zoom-val').textContent = Math.round(zoom * 100) + '%';
  canvas.renderAll();
}

// ──────────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────────
setCanvasSize(794, 1123);

window.addEventListener('resize', () => {
  const wasZoomed = zoom !== 1;
  if (!wasZoomed) fitZoom();
});

// Zoom controls
document.getElementById('zoomIn').onclick  = () => { zoom = Math.min(zoom + 0.1, 3); applyZoom(); };
document.getElementById('zoomOut').onclick = () => { zoom = Math.max(zoom - 0.1, 0.1); applyZoom(); };
document.getElementById('zoomFit').onclick = fitZoom;

// Canvas size selector
document.getElementById('canvas-size').addEventListener('change', e => {
  const [w, h] = SIZES[e.target.value];
  setCanvasSize(w, h);
  saveHistory();
});

// ──────────────────────────────────────────────────
//  TOOLS
// ──────────────────────────────────────────────────
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => setTool(btn.dataset.tool));
});

function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));

  canvas.isDrawingMode = (tool === 'draw');
  if (tool === 'draw') {
    canvas.freeDrawingBrush.color = '#8b1e2d';
    canvas.freeDrawingBrush.width = 4;
  }

  if (tool === 'select') {
    canvas.selection = true;
    canvas.defaultCursor = 'default';
  } else if (tool === 'image') {
    document.getElementById('imageFileInput').click();
    setTool('select');
  } else if (tool !== 'draw') {
    canvas.selection = false;
    canvas.defaultCursor = 'crosshair';
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  if (k === 'v') setTool('select');
  if (k === 'r') setTool('rect');
  if (k === 'c') setTool('circle');
  if (k === 't') setTool('text');
  if (k === 'l') setTool('line');
  if (k === 'd') setTool('draw');
  if ((k === 'delete' || k === 'backspace') && canvas.getActiveObject()) {
    deleteSelected(); e.preventDefault();
  }
  if ((e.ctrlKey || e.metaKey) && k === 'z') { undoAction(); }
  if ((e.ctrlKey || e.metaKey) && k === 'd') { e.preventDefault(); duplicateSelected(); }
});

// ──────────────────────────────────────────────────
//  SHAPE DRAWING on canvas mouse events
// ──────────────────────────────────────────────────
canvas.on('mouse:down', opt => {
  if (currentTool === 'select' || currentTool === 'draw' || currentTool === 'image') return;
  isDrawing = true;
  const p = canvas.getPointer(opt.e);
  drawStart = { x: p.x, y: p.y };

  if (currentTool === 'text') {
    const t = new fabric.IText('Votre texte', {
      left: p.x, top: p.y,
      fontFamily: 'Playfair Display',
      fontSize: 32,
      fill: '#111114',
      editable: true,
    });
    canvas.add(t);
    canvas.setActiveObject(t);
    t.enterEditing();
    isDrawing = false;
    setTool('select');
    saveHistory();
    return;
  }

  const defaults = { left: p.x, top: p.y, fill: '#8b1e2d', stroke: 'transparent', strokeWidth: 0, selectable: false };

  if (currentTool === 'rect')     tempShape = new fabric.Rect({ ...defaults, width: 0, height: 0, rx: 0, ry: 0 });
  if (currentTool === 'circle')   tempShape = new fabric.Ellipse({ ...defaults, rx: 0, ry: 0 });
  if (currentTool === 'triangle') tempShape = new fabric.Triangle({ ...defaults, width: 0, height: 0 });
  if (currentTool === 'line')     tempShape = new fabric.Line([p.x, p.y, p.x, p.y], { stroke: '#8b1e2d', strokeWidth: 3, selectable: false });

  if (tempShape) canvas.add(tempShape);
});

canvas.on('mouse:move', opt => {
  if (!isDrawing || !tempShape) return;
  const p   = canvas.getPointer(opt.e);
  const dx  = p.x - drawStart.x;
  const dy  = p.y - drawStart.y;
  const con = opt.e.shiftKey;

  if (currentTool === 'rect' || currentTool === 'triangle') {
    const w = Math.abs(dx), h = con ? Math.abs(dx) : Math.abs(dy);
    tempShape.set({ left: Math.min(p.x, drawStart.x), top: Math.min(p.y, drawStart.y), width: w, height: h });
  }
  if (currentTool === 'circle') {
    const rx = Math.abs(dx) / 2, ry = con ? rx : Math.abs(dy) / 2;
    tempShape.set({ left: Math.min(p.x, drawStart.x), top: Math.min(p.y, drawStart.y), rx, ry });
  }
  if (currentTool === 'line') {
    tempShape.set({ x2: p.x, y2: p.y });
  }
  canvas.renderAll();
});

canvas.on('mouse:up', () => {
  if (!isDrawing) return;
  isDrawing = false;
  if (tempShape) {
    tempShape.set({ selectable: true });
    canvas.setActiveObject(tempShape);
    tempShape = null;
    setTool('select');
    saveHistory();
  }
});

// ──────────────────────────────────────────────────
//  IMAGE IMPORT
// ──────────────────────────────────────────────────
document.getElementById('imageFileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = f => {
    fabric.Image.fromURL(f.target.result, img => {
      const scale = Math.min((cw * 0.6) / img.width, (ch * 0.6) / img.height, 1);
      img.scale(scale);
      img.set({ left: cw/2 - img.getScaledWidth()/2, top: ch/2 - img.getScaledHeight()/2 });
      canvas.add(img);
      canvas.setActiveObject(img);
      canvas.renderAll();
      saveHistory();
    });
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

// ──────────────────────────────────────────────────
//  BACKGROUND COLOR
// ──────────────────────────────────────────────────
const bgInput   = document.getElementById('bgColorInput');
const bgPreview = document.getElementById('bgColorPreview');
bgInput.addEventListener('input', () => {
  canvas.setBackgroundColor(bgInput.value, canvas.renderAll.bind(canvas));
  bgPreview.style.background = bgInput.value;
  saveHistory();
});

// ──────────────────────────────────────────────────
//  OBJECT SELECTION → properties panel
// ──────────────────────────────────────────────────
canvas.on('selection:created', updateProps);
canvas.on('selection:updated', updateProps);
canvas.on('object:modified', () => { updateProps(); saveHistory(); updateLayers(); });
canvas.on('object:added', updateLayers);
canvas.on('object:removed', updateLayers);

canvas.on('selection:cleared', () => {
  document.getElementById('no-selection').style.display = '';
  document.getElementById('selection-props').style.display = 'none';
  updateLayers();
});

function updateProps() {
  const obj = canvas.getActiveObject();
  if (!obj) return;

  suppressPropUpdate = true;
  document.getElementById('no-selection').style.display = 'none';
  document.getElementById('selection-props').style.display = '';

  document.getElementById('propX').value       = Math.round(obj.left / zoom);
  document.getElementById('propY').value       = Math.round(obj.top  / zoom);
  document.getElementById('propW').value       = Math.round((obj.width  || 0) * obj.scaleX);
  document.getElementById('propH').value       = Math.round((obj.height || 0) * obj.scaleY);
  document.getElementById('propAngle').value   = Math.round(obj.angle || 0);
  document.getElementById('propOpacity').value = obj.opacity !== undefined ? obj.opacity : 1;

  const fill = obj.fill;
  if (fill && fill !== 'transparent' && typeof fill === 'string') {
    document.getElementById('propFill').value = rgbToHex(fill) || '#8b1e2d';
    document.getElementById('propNoFill').classList.remove('active');
  } else {
    document.getElementById('propNoFill').classList.add('active');
  }

  const stroke = obj.stroke;
  if (stroke && stroke !== 'transparent') {
    document.getElementById('propStroke').value = rgbToHex(stroke) || '#000000';
  }
  document.getElementById('propStrokeW').value = obj.strokeWidth || 0;

  const isText = obj.type === 'i-text' || obj.type === 'text';
  document.getElementById('text-props').style.display = isText ? '' : 'none';
  if (isText) {
    document.getElementById('propFontSize').value    = obj.fontSize || 32;
    document.getElementById('propFont').value        = obj.fontFamily || 'Playfair Display';
    document.getElementById('propTextColor').value   = rgbToHex(obj.fill) || '#111114';
    document.getElementById('propBold').classList.toggle('active', obj.fontWeight === 'bold');
    document.getElementById('propItalic').classList.toggle('active', obj.fontStyle === 'italic');
    document.getElementById('propUnderline').classList.toggle('active', !!obj.underline);
  }

  document.getElementById('propShadow').checked = !!obj.shadow;
  suppressPropUpdate = false;
  updateLayers();
}

// Prop inputs → apply to object
function applyProp(fn) {
  if (suppressPropUpdate) return;
  const obj = canvas.getActiveObject();
  if (!obj) return;
  fn(obj);
  canvas.renderAll();
  saveHistory();
}

['propX','propY','propW','propH','propAngle'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    applyProp(obj => {
      const x = +document.getElementById('propX').value * zoom;
      const y = +document.getElementById('propY').value * zoom;
      const w = +document.getElementById('propW').value;
      const h = +document.getElementById('propH').value;
      const a = +document.getElementById('propAngle').value;
      obj.set({ left: x, top: y, angle: a });
      if (w && obj.width)  obj.scaleX = w / obj.width;
      if (h && obj.height) obj.scaleY = h / obj.height;
      obj.setCoords();
    });
  });
});

document.getElementById('propOpacity').addEventListener('input', () => {
  applyProp(obj => obj.set('opacity', +document.getElementById('propOpacity').value));
});

document.getElementById('propFill').addEventListener('input', () => {
  applyProp(obj => { obj.set('fill', document.getElementById('propFill').value); document.getElementById('propNoFill').classList.remove('active'); });
});

document.getElementById('propNoFill').addEventListener('click', () => {
  applyProp(obj => { obj.set('fill', 'transparent'); document.getElementById('propNoFill').classList.toggle('active'); });
});

document.getElementById('propStroke').addEventListener('input', () => {
  applyProp(obj => obj.set('stroke', document.getElementById('propStroke').value));
});
document.getElementById('propStrokeW').addEventListener('input', () => {
  applyProp(obj => obj.set('strokeWidth', +document.getElementById('propStrokeW').value));
});

document.getElementById('propFontSize').addEventListener('input', () => {
  applyProp(obj => obj.set('fontSize', +document.getElementById('propFontSize').value));
});
document.getElementById('propFont').addEventListener('change', () => {
  applyProp(obj => obj.set('fontFamily', document.getElementById('propFont').value));
});
document.getElementById('propTextColor').addEventListener('input', () => {
  applyProp(obj => obj.set('fill', document.getElementById('propTextColor').value));
});
document.getElementById('propBold').addEventListener('click', () => {
  applyProp(obj => {
    const bold = obj.fontWeight === 'bold';
    obj.set('fontWeight', bold ? 'normal' : 'bold');
    document.getElementById('propBold').classList.toggle('active', !bold);
  });
});
document.getElementById('propItalic').addEventListener('click', () => {
  applyProp(obj => {
    const it = obj.fontStyle === 'italic';
    obj.set('fontStyle', it ? 'normal' : 'italic');
    document.getElementById('propItalic').classList.toggle('active', !it);
  });
});
document.getElementById('propUnderline').addEventListener('click', () => {
  applyProp(obj => {
    obj.set('underline', !obj.underline);
    document.getElementById('propUnderline').classList.toggle('active', obj.underline);
  });
});

document.getElementById('propShadow').addEventListener('change', () => {
  applyProp(obj => {
    if (document.getElementById('propShadow').checked) {
      obj.set('shadow', new fabric.Shadow({ color: 'rgba(0,0,0,0.35)', blur: 15, offsetX: 4, offsetY: 4 }));
    } else {
      obj.set('shadow', null);
    }
  });
});

// Arrange
document.getElementById('bringForward').onclick = () => { const o = canvas.getActiveObject(); if(o){canvas.bringToFront(o);canvas.renderAll();saveHistory();}};
document.getElementById('sendBackward').onclick = () => { const o = canvas.getActiveObject(); if(o){canvas.sendToBack(o);canvas.renderAll();saveHistory();}};
document.getElementById('dupObj').onclick = duplicateSelected;
document.getElementById('delObj').onclick = deleteSelected;

function duplicateSelected() {
  const obj = canvas.getActiveObject();
  if (!obj) return;
  obj.clone(clone => {
    clone.set({ left: obj.left + 20, top: obj.top + 20 });
    canvas.add(clone);
    canvas.setActiveObject(clone);
    canvas.renderAll();
    saveHistory();
  });
}

function deleteSelected() {
  const obj = canvas.getActiveObject();
  if (!obj) return;
  if (obj._objects) {
    obj._objects.forEach(o => canvas.remove(o));
  } else {
    canvas.remove(obj);
  }
  canvas.discardActiveObject();
  canvas.renderAll();
  saveHistory();
}

// ──────────────────────────────────────────────────
//  LAYERS
// ──────────────────────────────────────────────────
function updateLayers() {
  const list    = document.getElementById('layers-list');
  const objects = canvas.getObjects();
  const active  = canvas.getActiveObject();

  list.innerHTML = '';
  [...objects].reverse().forEach((obj, ri) => {
    const i = objects.length - 1 - ri;
    const item = document.createElement('div');
    item.className = 'layer-item' + (obj === active ? ' active' : '');

    const icon = getLayerIcon(obj.type);
    const name = getLayerName(obj, i);

    item.innerHTML = `
      <div style="color:var(--accent)">${icon}</div>
      <div class="layer-name">${name}</div>
      <div class="layer-vis" title="Masquer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    `;
    item.querySelector('.layer-vis').addEventListener('click', e => {
      e.stopPropagation();
      obj.visible = !obj.visible;
      canvas.renderAll();
    });
    item.addEventListener('click', () => {
      canvas.setActiveObject(obj);
      canvas.renderAll();
      updateProps();
    });
    list.appendChild(item);
  });
}

function getLayerIcon(type) {
  const icons = {
    'rect':     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
    'ellipse':  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="10" ry="7"/></svg>',
    'triangle': '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 22 2 22"/></svg>',
    'i-text':   '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>',
    'image':    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
    'path':     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-3 7z"/></svg>',
    'line':     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="21" x2="21" y2="3"/></svg>',
  };
  return icons[type] || icons['rect'];
}

function getLayerName(obj, i) {
  if (obj.type === 'i-text' || obj.type === 'text') return (obj.text || '').slice(0, 20) || `Texte ${i+1}`;
  if (obj.type === 'image') return `Image ${i+1}`;
  const names = { rect:'Rectangle', ellipse:'Cercle', triangle:'Triangle', line:'Ligne', path:'Dessin' };
  return (names[obj.type] || 'Forme') + ` ${i+1}`;
}

// ──────────────────────────────────────────────────
//  CLEAR CANVAS
// ──────────────────────────────────────────────────
document.getElementById('clearCanvas').addEventListener('click', () => {
  if (!canvas.getObjects().length) return;
  if (!confirm('Vider tout le canvas ?')) return;
  canvas.clear();
  canvas.setBackgroundColor('#ffffff', canvas.renderAll.bind(canvas));
  bgInput.value = '#ffffff';
  bgPreview.style.background = '#ffffff';
  saveHistory();
  updateLayers();
});

// ──────────────────────────────────────────────────
//  UNDO
// ──────────────────────────────────────────────────
function saveHistory() {
  history.push(JSON.stringify(canvas.toJSON()));
  if (history.length > 40) history.shift();
  updateLayers();
}

function undoAction() {
  if (history.length < 2) return;
  history.pop();
  const state = history[history.length - 1];
  canvas.loadFromJSON(state, () => {
    canvas.renderAll();
    updateLayers();
  });
}

document.getElementById('undoBtn').addEventListener('click', undoAction);

// ──────────────────────────────────────────────────
//  EXPORT
// ──────────────────────────────────────────────────
document.getElementById('exportPng').addEventListener('click', () => {
  const savedZoom = zoom;
  canvas.setZoom(1);
  canvas.setWidth(cw); canvas.setHeight(ch);
  canvas.renderAll();

  const dataURL = canvas.toDataURL({ format: 'png', multiplier: 1 });
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = 'isaac-solverro-design.png';
  a.click();

  canvas.setZoom(savedZoom);
  canvas.setWidth(Math.round(cw * savedZoom));
  canvas.setHeight(Math.round(ch * savedZoom));
  canvas.renderAll();
  toast('Export PNG réussi ✓');
});

document.getElementById('exportPdf').addEventListener('click', async () => {
  const { jsPDF } = window.jspdf;
  const savedZoom = zoom;
  canvas.setZoom(1);
  canvas.setWidth(cw); canvas.setHeight(ch);
  canvas.renderAll();

  const dataURL = canvas.toDataURL({ format: 'png', multiplier: 1 });

  const orientation = cw > ch ? 'landscape' : 'portrait';
  const pdf = new jsPDF({
    orientation,
    unit: 'px',
    format: [cw, ch],
    hotfixes: ['px_scaling'],
  });

  pdf.addImage(dataURL, 'PNG', 0, 0, cw, ch);
  pdf.save('isaac-solverro-design.pdf');

  canvas.setZoom(savedZoom);
  canvas.setWidth(Math.round(cw * savedZoom));
  canvas.setHeight(Math.round(ch * savedZoom));
  canvas.renderAll();
  toast('Export PDF réussi ✓');
});

function applyTemplate(tpl) {
  canvas.clear();
  const bg = '#ffffff';
  canvas.setBackgroundColor(bg, canvas.renderAll.bind(canvas));
  bgInput.value = bg; bgPreview.style.background = bg;

  if (tpl === 'trading') {
    canvas.setBackgroundColor('#0a0a0c', canvas.renderAll.bind(canvas));
    bgInput.value = '#0a0a0c'; bgPreview.style.background = '#0a0a0c';

    const header = new fabric.Rect({ left: 0, top: 0, width: cw, height: 120, fill: '#8b1e2d', selectable: true });
    const title  = new fabric.IText('SETUP TRADE', { left: 40, top: 35, fontSize: 52, fontFamily: 'Playfair Display', fill: '#ffffff', fontWeight: '700' });
    const sub    = new fabric.IText('Date • Ticker • Session', { left: 40, top: 105, fontSize: 22, fontFamily: 'Inter', fill: 'rgba(255,255,255,0.6)', fontWeight: '300' });
    const note   = new fabric.IText('Notes & analyse ici...', { left: 40, top: 180, fontSize: 20, fontFamily: 'Inter', fill: '#a0a0a8' });
    const result = new fabric.IText('+0.00%', { left: cw - 200, top: ch - 120, fontSize: 64, fontFamily: 'Playfair Display', fill: '#22c55e', fontWeight: '700' });
    [header, title, sub, note, result].forEach(o => canvas.add(o));

  } else if (tpl === 'journal') {
    const header = new fabric.Rect({ left: 0, top: 0, width: cw, height: 100, fill: '#8b1e2d' });
    const title  = new fabric.IText('JOURNAL DE TRADING', { left: 40, top: 25, fontSize: 42, fontFamily: 'Playfair Display', fill: '#ffffff', fontWeight: '700' });
    const line1  = new fabric.Line([40, 200, cw - 40, 200], { stroke: '#ddd', strokeWidth: 1 });
    const line2  = new fabric.Line([40, 300, cw - 40, 300], { stroke: '#ddd', strokeWidth: 1 });
    const line3  = new fabric.Line([40, 400, cw - 40, 400], { stroke: '#ddd', strokeWidth: 1 });
    const label1 = new fabric.IText('Date :', { left: 40, top: 165, fontSize: 20, fontFamily: 'Inter', fill: '#888', fontWeight: '400' });
    const label2 = new fabric.IText('P&L :', { left: 40, top: 265, fontSize: 20, fontFamily: 'Inter', fill: '#888' });
    const label3 = new fabric.IText('Analyse :', { left: 40, top: 365, fontSize: 20, fontFamily: 'Inter', fill: '#888' });
    [header, title, line1, line2, line3, label1, label2, label3].forEach(o => canvas.add(o));

  } else if (tpl === 'affiche') {
    canvas.setBackgroundColor('#0d0204', canvas.renderAll.bind(canvas));
    bgInput.value = '#0d0204'; bgPreview.style.background = '#0d0204';

    const accent = new fabric.Rect({ left: 0, top: 0, width: 18, height: ch, fill: '#8b1e2d' });
    const name   = new fabric.IText('ISAAC', { left: 60, top: ch/2 - 130, fontSize: 120, fontFamily: 'Playfair Display', fill: '#ffffff', fontWeight: '700' });
    const last   = new fabric.IText('SOLVERRO', { left: 60, top: ch/2 - 10, fontSize: 64, fontFamily: 'Playfair Display', fill: '#8b1e2d', fontWeight: '700' });
    const tagline = new fabric.IText('Trading • Analyse • Performance', { left: 60, top: ch/2 + 80, fontSize: 22, fontFamily: 'Inter', fill: 'rgba(255,255,255,0.4)', fontWeight: '300' });
    [accent, name, last, tagline].forEach(o => canvas.add(o));
  }
  // blank = nothing added

  canvas.renderAll();
  saveHistory();
  toast(`Modèle "${tpl}" appliqué`);
}

function toast(msg) {
  const c  = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ok';
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> ${msg}`;
  c.appendChild(el);
  setTimeout(() => { el.style.animation = 'toastOut 0.3s forwards'; setTimeout(() => el.remove(), 300); }, 2500);
}

// ──────────────────────────────────────────────────
function rgbToHex(color) {
  if (!color) return '#000000';
  if (color.startsWith('#')) return color;
  const m = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '#000000';
  return '#' + [m[1],m[2],m[3]].map(x => (+x).toString(16).padStart(2,'0')).join('');
}
