<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Louken — Galerie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0c;
      --bg-card: #111114;
      --surface: #16161a;
      --border: rgba(255,255,255,0.07);
      --text: #f0eff4;
      --text-muted: #7a7a86;
      --accent: #8b1e2d;
      --accent-glow: rgba(139,30,45,0.35);
      --accent-light: #b02436;
      --radius: 14px;
      --transition: all 0.3s cubic-bezier(.16,1,.3,1);
    }

    [data-theme="light"] {
      --bg: #f5f4f0;
      --bg-card: #ffffff;
      --surface: #eeece8;
      --border: rgba(0,0,0,0.07);
      --text: #1a1a1e;
      --text-muted: #888890;
      --accent: #8b1e2d;
      --accent-glow: rgba(139,30,45,0.18);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    /* ── GRAIN ───────────────────────────────────────────── */
    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.6;
      mix-blend-mode: overlay;
    }

    /* ── HEADER ──────────────────────────────────────────── */
    header {
      padding: 1.1rem 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10,10,12,0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    [data-theme="light"] header {
      background: rgba(245,244,240,0.8);
    }

    .logo {
      display: flex; align-items: center; gap: 14px; text-decoration: none;
    }

    .logo-back {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .logo-back:hover { background: var(--accent); border-color: var(--accent); color: white; }
    .logo-back svg { width: 16px; height: 16px; }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .logo-text span { color: var(--accent); }

    .header-right { display: flex; gap: 10px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.88rem;
      cursor: pointer;
      transition: var(--transition);
      background: var(--surface);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
    .btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .btn-accent:hover { background: var(--accent-light); border-color: var(--accent-light); color: white; box-shadow: 0 8px 24px var(--accent-glow); }

    .btn-ghost { background: transparent; }

    /* count badge */
    .count-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent);
      color: white;
      font-size: 0.72rem;
      font-weight: 600;
      min-width: 20px; height: 20px;
      border-radius: 999px;
      padding: 0 5px;
      transition: var(--transition);
    }

    /* ── HERO / DROP ZONE ────────────────────────────────── */
    #dropzone {
      margin: 2rem auto 0;
      width: 92%;
      max-width: 820px;
      padding: 3.5rem 2rem;
      border: 1.5px dashed var(--border);
      border-radius: 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: rgba(255,255,255,0.015);
      position: relative;
      overflow: hidden;
    }

    #dropzone::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, var(--accent-glow) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #dropzone:hover::before,
    #dropzone.dragover::before { opacity: 1; }

    #dropzone:hover,
    #dropzone.dragover {
      border-color: var(--accent);
      transform: scale(1.005);
    }

    .drop-icon {
      width: 52px; height: 52px;
      margin: 0 auto 1.2rem;
      color: var(--text-muted);
      transition: var(--transition);
    }

    #dropzone:hover .drop-icon { color: var(--accent); transform: scale(1.1); }

    .drop-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .drop-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .drop-sub strong { color: var(--accent); font-weight: 600; }

    /* ── TOOLBAR ─────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 1.5rem 4%;
      max-width: 1800px;
      margin: 0 auto;
    }

    .toolbar-left {
      display: flex; align-items: center; gap: 12px;
    }

    .toolbar-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .toolbar-info strong { color: var(--text); font-weight: 600; }

    .view-toggle {
      display: flex;
      background: var(--surface);
      border-radius: 10px;
      padding: 3px;
      border: 1px solid var(--border);
      gap: 2px;
    }

    .view-btn {
      padding: 6px 10px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      display: flex; align-items: center;
    }
    .view-btn svg { width: 15px; height: 15px; }
    .view-btn.active { background: var(--accent); color: white; }

    /* ── GALLERY GRID ────────────────────────────────────── */
    .gallery {
      columns: 300px 4;
      column-gap: 1.2rem;
      padding: 0 4% 4rem;
      max-width: 1800px;
      margin: 0 auto;
      transition: columns 0.3s ease;
    }

    .gallery.list-view {
      columns: 1;
      max-width: 900px;
    }

    .image-card {
      break-inside: avoid;
      margin-bottom: 1.2rem;
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
      transition: var(--transition);
      cursor: zoom-in;
      animation: fadeUp 0.4s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .image-card:hover {
      transform: translateY(-6px);
      border-color: rgba(139,30,45,0.4);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45), 0 0 0 1px rgba(139,30,45,0.2);
    }

    .image-card img {
      width: 100%; display: block;
      transition: transform 0.5s cubic-bezier(.16,1,.3,1);
    }

    .image-card:hover img { transform: scale(1.04); }

    /* overlay */
    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      padding: 14px;
    }

    .image-card:hover .card-overlay { opacity: 1; }

    .card-actions { display: flex; gap: 8px; margin-left: auto; }

    .card-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      transform: translateY(6px);
      opacity: 0;
    }

    .image-card:hover .card-btn {
      transform: translateY(0);
      opacity: 1;
    }

    .image-card:hover .card-btn:nth-child(2) { transition-delay: 0.05s; }

    .card-btn:hover { background: var(--accent); border-color: var(--accent); }
    .card-btn.del-btn:hover { background: #ef4444; border-color: #ef4444; }
    .card-btn svg { width: 14px; height: 14px; }

    /* list view card */
    .gallery.list-view .image-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px;
      cursor: default;
    }

    .gallery.list-view .image-card img {
      width: 100px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .gallery.list-view .card-overlay { display: none; }

    .list-info {
      display: none;
      flex: 1;
    }

    .gallery.list-view .list-info {
      display: block;
    }

    .list-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }

    .list-size {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .list-actions {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .gallery.list-view .list-actions { display: flex; }

    /* ── EMPTY STATE ─────────────────────────────────────── */
    #empty-state {
      text-align: center;
      padding: 5rem 2rem;
      display: none;
    }

    #empty-state.visible { display: block; }

    .empty-icon {
      width: 64px; height: 64px;
      color: var(--text-muted);
      margin: 0 auto 1.5rem;
      opacity: 0.4;
    }

    .empty-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .empty-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ── VIEWER ──────────────────────────────────────────── */
    #viewer {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.96);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #viewer.active { display: flex; }

    .viewer-inner {
      position: relative;
      max-width: 94vw;
      max-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #viewerImg {
      max-width: 94vw;
      max-height: 82vh;
      border-radius: 16px;
      object-fit: contain;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
      animation: zoomIn 0.25s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* nav arrows */
    .viewer-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px; height: 48px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      z-index: 10000;
    }

    .viewer-arrow:hover { background: var(--accent); border-color: var(--accent); }
    .viewer-arrow svg { width: 20px; height: 20px; }
    #prevBtn { left: 2%; }
    #nextBtn { right: 2%; }

    .viewer-arrow:disabled { opacity: 0.2; pointer-events: none; }

    /* viewer bar */
    .viewer-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      z-index: 10000;
    }

    .viewer-counter {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
    }

    .viewer-actions { display: flex; gap: 10px; }

    /* close */
    .viewer-close {
      position: fixed;
      top: 1.2rem; right: 1.5rem;
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      z-index: 10001;
    }
    .viewer-close:hover { background: #ef4444; border-color: #ef4444; }
    .viewer-close svg { width: 18px; height: 18px; }

    /* ── TOAST ───────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: toastIn 0.3s cubic-bezier(.16,1,.3,1) both;
      display: flex; align-items: center; gap: 8px;
    }

    .toast.success { border-color: rgba(34,197,94,0.3); }
    .toast.error { border-color: rgba(239,68,68,0.3); }
    .toast svg { width: 15px; height: 15px; flex-shrink: 0; }
    .toast.success svg { color: #22c55e; }
    .toast.error svg { color: #ef4444; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(10px); }
    }

    /* ── CONFIRM MODAL ───────────────────────────────────── */
    #confirm-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 99998;
      display: none;
      align-items: center; justify-content: center;
    }
    #confirm-modal.active { display: flex; }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 2.2rem;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      animation: zoomIn 0.25s cubic-bezier(.16,1,.3,1) both;
    }

    .modal-icon {
      width: 48px; height: 48px;
      background: rgba(239,68,68,0.1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.2rem;
      color: #ef4444;
    }
    .modal-icon svg { width: 22px; height: 22px; }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .modal-sub { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.8rem; }

    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .btn { flex: 1; justify-content: center; }

    .btn-red { background: #ef4444; border-color: #ef4444; color: white; }
    .btn-red:hover { background: #dc2626; border-color: #dc2626; color: white; }

    /* ── PROGRESS ────────────────────────────────────────── */
    #upload-progress {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      z-index: 99997;
      display: none;
    }

    #upload-progress.active { display: block; }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      width: 0%;
      transition: width 0.2s ease;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 900px) {
      .gallery { columns: 2; }
    }

    @media (max-width: 600px) {
      .gallery { columns: 1; padding: 0 3% 4rem; }
      header { padding: 0.9rem 4%; }
      .logo-text { font-size: 1.1rem; }
      .btn span { display: none; }
      #prevBtn { left: 0.5rem; }
      #nextBtn { right: 0.5rem; }
    }
  </style>
</head>
<body>

<div class="grain"></div>

<!-- ── HEADER ─────────────────────────────────────────────── -->
<header>
  <a href="index.html" class="logo">
    <div class="logo-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <span class="logo-text">Louken <span>C</span></span>
  </a>
  <div class="header-right">
    <button class="btn btn-ghost" id="clearAll">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      <span>Tout supprimer</span>
    </button>
    <button class="btn" id="toggleTheme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span id="themeLabel">Mode clair</span>
    </button>
    <button class="btn btn-accent" id="uploadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 5 5 12"/></svg>
      <span>Ajouter</span>
      <span class="count-badge" id="countBadge">0</span>
    </button>
  </div>
</header>

<!-- ── PROGRESS BAR ───────────────────────────────────────── -->
<div id="upload-progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

<!-- ── DROP ZONE ──────────────────────────────────────────── -->
<div id="dropzone">
  <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="3"/>
    <circle cx="8.5" cy="8.5" r="1.5"/>
    <polyline points="21 15 16 10 5 21"/>
  </svg>
  <div class="drop-title">Glisse tes captures de trades ici</div>
  <div class="drop-sub">ou <strong>clique pour sélectionner</strong> • Toutes images acceptées • Stockage local illimité</div>
  <input type="file" id="fileInput" multiple accept="image/*" style="display:none;">
</div>

<!-- ── TOOLBAR ────────────────────────────────────────────── -->
<div class="toolbar">
  <div class="toolbar-left">
    <div class="toolbar-info" id="toolbarInfo">
      <strong id="countText">0</strong> image<span id="plural"></span>
    </div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <div class="view-toggle">
      <button class="view-btn active" id="gridViewBtn" title="Grille">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button class="view-btn" id="listViewBtn" title="Liste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ── GALLERY ────────────────────────────────────────────── -->
<div class="gallery" id="gallery"></div>

<!-- ── EMPTY STATE ───────────────────────────────────────── -->
<div id="empty-state">
  <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="3"/>
    <circle cx="8.5" cy="8.5" r="1.5"/>
    <polyline points="21 15 16 10 5 21"/>
  </svg>
  <div class="empty-title">Aucune image</div>
  <div class="empty-sub">Glisse tes captures ici pour commencer</div>
</div>

<!-- ── VIEWER ─────────────────────────────────────────────── -->
<div id="viewer">
  <button class="viewer-close" id="closeBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>

  <button class="viewer-arrow" id="prevBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>

  <div class="viewer-inner">
    <img id="viewerImg" alt="Image agrandie">
  </div>

  <button class="viewer-arrow" id="nextBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <div class="viewer-bar">
    <div class="viewer-counter" id="viewerCounter">1 / 1</div>
    <div class="viewer-actions">
      <button class="btn" id="downloadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Télécharger</span>
      </button>
      <button class="btn btn-ghost" onclick="closeViewer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>Fermer</span>
      </button>
    </div>
  </div>
</div>

<!-- ── CONFIRM MODAL ──────────────────────────────────────── -->
<div id="confirm-modal">
  <div class="modal-box">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </div>
    <div class="modal-title" id="modalTitle">Supprimer tout ?</div>
    <div class="modal-sub" id="modalSub">Cette action est irréversible.</div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Annuler</button>
      <button class="btn btn-red" id="modalConfirm">Supprimer</button>
    </div>
  </div>
</div>

<!-- ── TOAST ──────────────────────────────────────────────── -->
<div id="toast-container"></div>

<script>
// ─────────────────────────────────────────────
//  IndexedDB helper
// ─────────────────────────────────────────────
const DB_NAME    = 'solverro_gallery';
const DB_VERSION = 1;
const STORE      = 'images';

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror   = () => reject(req.error);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

function dbAdd(blob, name, size) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).add({ blob, name, size, added: Date.now() });
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror   = () => reject(req.error);
  });
}

function dbClear() {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).clear();
    req.onsuccess = () => resolve();
    req.onerror   = () => reject(req.error);
  });
}

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let images     = [];   // [{id, blob, name, size, url}]
let viewerIdx  = 0;
let isListView = false;

// ─────────────────────────────────────────────
//  DOM refs
// ─────────────────────────────────────────────
const gallery      = document.getElementById('gallery');
const dropzone     = document.getElementById('dropzone');
const fileInput    = document.getElementById('fileInput');
const viewer       = document.getElementById('viewer');
const viewerImg    = document.getElementById('viewerImg');
const viewerCtr    = document.getElementById('viewerCounter');
const downloadBtn  = document.getElementById('downloadBtn');
const toggleTheme  = document.getElementById('toggleTheme');
const themeLabel   = document.getElementById('themeLabel');
const themeIcon    = document.getElementById('themeIcon');
const clearAllBtn  = document.getElementById('clearAll');
const uploadBtn    = document.getElementById('uploadBtn');
const countBadge   = document.getElementById('countBadge');
const countText    = document.getElementById('countText');
const plural       = document.getElementById('plural');
const emptyState   = document.getElementById('empty-state');
const progressBar  = document.getElementById('progressBar');
const progressWrap = document.getElementById('upload-progress');
const prevBtn      = document.getElementById('prevBtn');
const nextBtn      = document.getElementById('nextBtn');
const gridViewBtn  = document.getElementById('gridViewBtn');
const listViewBtn  = document.getElementById('listViewBtn');
const modalEl      = document.getElementById('confirm-modal');
const modalTitle   = document.getElementById('modalTitle');
const modalSub     = document.getElementById('modalSub');
const modalConfirm = document.getElementById('modalConfirm');
const modalCancel  = document.getElementById('modalCancel');

// ─────────────────────────────────────────────
//  Toast
// ─────────────────────────────────────────────
function toast(msg, type = 'success') {
  const t   = document.getElementById('toast-container');
  const el  = document.createElement('div');
  const ico = type === 'success'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  el.className = `toast ${type}`;
  el.innerHTML = `${ico} ${msg}`;
  t.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut 0.3s forwards';
    setTimeout(() => el.remove(), 300);
  }, 2800);
}

// ─────────────────────────────────────────────
//  Confirm modal
// ─────────────────────────────────────────────
function confirm(title, sub) {
  return new Promise(resolve => {
    modalTitle.textContent  = title;
    modalSub.textContent    = sub;
    modalEl.classList.add('active');
    const yes = () => { cleanup(); resolve(true);  };
    const no  = () => { cleanup(); resolve(false); };
    const cleanup = () => {
      modalEl.classList.remove('active');
      modalConfirm.removeEventListener('click', yes);
      modalCancel.removeEventListener('click', no);
    };
    modalConfirm.addEventListener('click', yes);
    modalCancel.addEventListener('click', no);
  });
}

// ─────────────────────────────────────────────
//  Render
// ─────────────────────────────────────────────
function updateCount() {
  const n = images.length;
  countBadge.textContent = n;
  countText.textContent  = n;
  plural.textContent     = n > 1 ? 's' : '';
  emptyState.classList.toggle('visible', n === 0);
}

function render() {
  gallery.innerHTML = '';
  images.forEach((img, i) => {
    const card = document.createElement('div');
    card.className   = 'image-card';
    card.style.animationDelay = `${i * 0.035}s`;

    const image = document.createElement('img');
    image.src     = img.url;
    image.alt     = img.name || `Image ${i + 1}`;
    image.loading = 'lazy';
    image.onclick = () => openViewer(i);

    // overlay
    const overlay = document.createElement('div');
    overlay.className = 'card-overlay';

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const zoomBtn = document.createElement('button');
    zoomBtn.className = 'card-btn';
    zoomBtn.title     = 'Agrandir';
    zoomBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>';
    zoomBtn.onclick = e => { e.stopPropagation(); openViewer(i); };

    const dlBtn = document.createElement('button');
    dlBtn.className = 'card-btn';
    dlBtn.title     = 'Télécharger';
    dlBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    dlBtn.onclick = e => { e.stopPropagation(); downloadImage(img); };

    const delBtn = document.createElement('button');
    delBtn.className = 'card-btn del-btn';
    delBtn.title     = 'Supprimer';
    delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>';
    delBtn.onclick = async e => {
      e.stopPropagation();
      const ok = await confirm('Supprimer cette image ?', 'Cette action est irréversible.');
      if (!ok) return;
      await dbDelete(img.id);
      URL.revokeObjectURL(img.url);
      images.splice(i, 1);
      render();
      updateCount();
      toast('Image supprimée');
    };

    actions.append(zoomBtn, dlBtn, delBtn);
    overlay.appendChild(actions);

    // list extras
    const listInfo = document.createElement('div');
    listInfo.className = 'list-info';
    listInfo.innerHTML = `<div class="list-name">${img.name || `Image ${i+1}`}</div><div class="list-size">${formatSize(img.size)}</div>`;

    const listActs = document.createElement('div');
    listActs.className = 'list-actions';

    const lDl = document.createElement('button');
    lDl.className = 'btn'; lDl.title = 'Télécharger';
    lDl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    lDl.onclick = () => downloadImage(img);

    const lDel = document.createElement('button');
    lDel.className = 'btn btn-ghost'; lDel.title = 'Supprimer';
    lDel.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>';
    lDel.onclick = async () => {
      const ok = await confirm('Supprimer cette image ?', 'Cette action est irréversible.');
      if (!ok) return;
      await dbDelete(img.id);
      URL.revokeObjectURL(img.url);
      images.splice(i, 1);
      render();
      updateCount();
      toast('Image supprimée');
    };

    listActs.append(lDl, lDel);

    card.append(image, overlay, listInfo, listActs);
    gallery.appendChild(card);
  });

  updateCount();
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

// ─────────────────────────────────────────────
//  Add files
// ─────────────────────────────────────────────
async function addFiles(files) {
  const list = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!list.length) return;

  progressWrap.classList.add('active');
  progressBar.style.width = '0%';

  for (let i = 0; i < list.length; i++) {
    const file = list[i];
    try {
      const id  = await dbAdd(file, file.name, file.size);
      const url = URL.createObjectURL(file);
      images.push({ id, blob: file, name: file.name, size: file.size, url });
    } catch (e) {
      console.error(e);
    }
    progressBar.style.width = `${((i + 1) / list.length) * 100}%`;
  }

  render();

  setTimeout(() => {
    progressWrap.classList.remove('active');
    progressBar.style.width = '0%';
  }, 600);

  toast(`${list.length} image${list.length > 1 ? 's' : ''} ajoutée${list.length > 1 ? 's' : ''}`);
}

// ─────────────────────────────────────────────
//  Viewer
// ─────────────────────────────────────────────
function openViewer(idx) {
  viewerIdx = idx;
  updateViewer();
  viewer.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  viewer.classList.remove('active');
  document.body.style.overflow = '';
}

function updateViewer() {
  const img = images[viewerIdx];
  viewerImg.src          = img.url;
  viewerCtr.textContent  = `${viewerIdx + 1} / ${images.length}`;
  prevBtn.disabled       = viewerIdx === 0;
  nextBtn.disabled       = viewerIdx === images.length - 1;
}

prevBtn.onclick = () => { if (viewerIdx > 0) { viewerIdx--; updateViewer(); } };
nextBtn.onclick = () => { if (viewerIdx < images.length - 1) { viewerIdx++; updateViewer(); } };
document.getElementById('closeBtn').onclick = closeViewer;

// ─────────────────────────────────────────────
//  Download
// ─────────────────────────────────────────────
function downloadImage(img) {
  const a = document.createElement('a');
  a.href     = img.url;
  a.download = img.name || 'image.jpg';
  a.click();
}

downloadBtn.onclick = () => downloadImage(images[viewerIdx]);

// ─────────────────────────────────────────────
//  Keyboard
// ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!viewer.classList.contains('active')) return;
  if (e.key === 'Escape')      closeViewer();
  if (e.key === 'ArrowLeft')   { if (viewerIdx > 0) { viewerIdx--; updateViewer(); } }
  if (e.key === 'ArrowRight')  { if (viewerIdx < images.length - 1) { viewerIdx++; updateViewer(); } }
});

// close on bg click
viewer.onclick = e => { if (e.target === viewer) closeViewer(); };

// ─────────────────────────────────────────────
//  Drop events
// ─────────────────────────────────────────────
dropzone.onclick    = () => fileInput.click();
uploadBtn.onclick   = () => fileInput.click();
fileInput.onchange  = e => addFiles(e.target.files);

dropzone.ondragover  = e => { e.preventDefault(); dropzone.classList.add('dragover'); };
dropzone.ondragleave = () => dropzone.classList.remove('dragover');
dropzone.ondrop      = e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
};

// Global drag drop
document.addEventListener('dragover',  e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if (e.target !== dropzone) addFiles(e.dataTransfer.files);
});

// ─────────────────────────────────────────────
//  Clear all
// ─────────────────────────────────────────────
clearAllBtn.onclick = async () => {
  if (!images.length) return;
  const ok = await confirm(
    `Supprimer les ${images.length} image${images.length > 1 ? 's' : ''} ?`,
    'Toutes les images seront supprimées définitivement.'
  );
  if (!ok) return;
  await dbClear();
  images.forEach(i => URL.revokeObjectURL(i.url));
  images = [];
  render();
  toast(`Galerie vidée`, 'success');
};

// ─────────────────────────────────────────────
//  Theme
// ─────────────────────────────────────────────
let isDark = localStorage.getItem('solverro_theme') !== 'light';

function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeLabel.textContent = isDark ? 'Mode clair' : 'Mode sombre';
  themeIcon.innerHTML = isDark
    ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
}

toggleTheme.onclick = () => {
  isDark = !isDark;
  localStorage.setItem('solverro_theme', isDark ? 'dark' : 'light');
  applyTheme();
};

applyTheme();

// ─────────────────────────────────────────────
//  View toggle
// ─────────────────────────────────────────────
gridViewBtn.onclick = () => {
  isListView = false;
  gallery.classList.remove('list-view');
  gridViewBtn.classList.add('active');
  listViewBtn.classList.remove('active');
};

listViewBtn.onclick = () => {
  isListView = true;
  gallery.classList.add('list-view');
  listViewBtn.classList.add('active');
  gridViewBtn.classList.remove('active');
};

// ─────────────────────────────────────────────
//  Init — load from IndexedDB
// ─────────────────────────────────────────────
openDB().then(async () => {
  const rows = await dbGetAll();
  images = rows.map(r => ({
    id:   r.id,
    blob: r.blob,
    name: r.name,
    size: r.size,
    url:  URL.createObjectURL(r.blob)
  }));
  render();
}).catch(err => {
  console.error('IndexedDB error:', err);
  toast('Erreur de base de données', 'error');
});
</script>
</body>
</html>
